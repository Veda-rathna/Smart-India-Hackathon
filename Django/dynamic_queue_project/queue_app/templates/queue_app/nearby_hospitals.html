<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nearby Hospitals</title>
    <!-- Load Leaflet.js for OpenStreetMap -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <style>
      /* Previous styles */
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }

      .navbar {
        background-color: #333;
        padding: 1em;
      }

      .navbar ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
      }

      .navbar ul li {
        float: left;
      }

      .navbar ul li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
      }

      .navbar ul li a:hover {
        background-color: #111;
      }

      .logout {
        float: right;
      }

      .container {
        margin: 20px auto;
        padding: 20px;
        max-width: 800px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
      }

      button {
        display: block;
        margin: 0 auto;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
      }

      button:hover {
        background-color: #45a049;
      }

      #location,
      #hospital-info {
        text-align: left;
        margin-top: 10px;
        font-size: 16px;
      }

      /* Map styling */
      #map {
        height: 500px;
        width: 100%;
        margin-top: 20px;
        border-radius: 8px;
      }

      .dropdown-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      /* Dropdown styles */
      .dropdown {
        width: 45%;
      }

      .dropdown select {
        width: 100%;
        padding: 10px;
        font-size: 16px;
      }

      .searchbar {
        width: 45%;
      }

      .searchbar input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
      }

      /* Hospital info styling */
      .hospital-list {
        display: flex;
        flex-direction: column;
      }

      .hospital-info-item {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #ddd;
      }

      .hospital-info-item .name {
        flex: 1;
      }

      .hospital-info-item .distance {
        text-align: right;
      }

      /* Responsive adjustments */
      @media screen and (max-width: 768px) {
        .container {
          width: 90%;
        }

        .dropdown-container {
          flex-direction: column;
        }

        .dropdown, .searchbar {
          width: 100%;
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="{% url 'nearby_hospitals' %}">Nearby Hospitals</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Help</a></li>
        <li><a href="#" class="logout">Logout</a></li>
      </ul>
    </nav>

    <div class="container">
      <h1>Find the Nearest Hospitals</h1>
      <button onclick="getLocation()">Get My Location</button>
      
      <!-- Dropdown and Search Bar -->
      <div class="dropdown-container">
        <div class="dropdown">
          <select id="hospitalDropdown" onchange="moveToHospital()">
            <option value="" selected>Select a hospital</option>
            <!-- Hospital options will be dynamically added here -->
          </select>
        </div>

        <div class="searchbar">
          <input type="text" id="hospitalSearch" placeholder="Search hospitals..." onkeyup="searchHospital()" />
        </div>
      </div>

      <div id="map"></div>
      <p id="location">Your location will appear here...</p>
      <div id="hospital-info" class="hospital-list">
        <!-- Hospital information will appear here -->
      </div>
    </div>

    <script>
      let map;
      let hospitalMarkers = [];
      let hospitalsWithDistance = []; // To store hospital data

      function initMap(lat, lng) {
        map = L.map("map").setView([lat, lng], 15);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        L.marker([lat, lng]).addTo(map).bindPopup("You are here").openPopup();

        fetchHospitals(lat, lng);
      }

      function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Radius of the Earth in km
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; // Distance in km
      }

      function fetchHospitals(lat, lng) {
        const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json];node(around:30000,${lat},${lng})[amenity=hospital];out;`;

        fetch(overpassUrl)
          .then((response) => response.json())
          .then((data) => {
            hospitalsWithDistance = data.elements.map((hospital) => {
              const hospitalLat = hospital.lat;
              const hospitalLng = hospital.lon;
              const hospitalName = hospital.tags.name || "Unnamed Hospital";
              const distance = calculateDistance(lat, lng, hospitalLat, hospitalLng);

              return { name: hospitalName, lat: hospitalLat, lng: hospitalLng, distance };
            });

            hospitalsWithDistance.sort((a, b) => a.distance - b.distance);

            hospitalsWithDistance.forEach((hospital) => {
              const marker = L.marker([hospital.lat, hospital.lng]).addTo(map).bindPopup(`<strong>${hospital.name}</strong><br>Distance: ${hospital.distance.toFixed(2)} km`);
              hospitalMarkers.push(marker);

              displayHospitalInfo(hospital.name, hospital.distance);
              addHospitalToDropdown(hospital.name);
            });
          })
          .catch((error) => console.error("Error fetching hospital data:", error));
      }

      function displayHospitalInfo(name, distance) {
        const hospitalInfoElement = document.getElementById('hospital-info');
        const infoItem = document.createElement('div');
        infoItem.className = 'hospital-info-item';
        
        const nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.innerText = name;
        
        const distanceSpan = document.createElement('span');
        distanceSpan.className = 'distance';
        distanceSpan.innerText = `${distance.toFixed(2)} km`;
        
        infoItem.appendChild(nameSpan);
        infoItem.appendChild(distanceSpan);

        hospitalInfoElement.appendChild(infoItem);
      }

      function addHospitalToDropdown(name) {
        const dropdown = document.getElementById('hospitalDropdown');
        const option = document.createElement('option');
        option.value = name;
        option.innerText = name;
        dropdown.appendChild(option);
      }

      function moveToHospital() {
        const selectedHospital = document.getElementById('hospitalDropdown').value;
        const hospital = hospitalsWithDistance.find(h => h.name === selectedHospital);
        if (hospital) {
          map.setView([hospital.lat, hospital.lng], 15);
        }
      }

      function searchHospital() {
        const searchQuery = document.getElementById('hospitalSearch').value.toLowerCase();
        const filteredHospitals = hospitalsWithDistance.filter(h => h.name.toLowerCase().includes(searchQuery));

        hospitalMarkers.forEach(marker => marker.removeFrom(map));
        filteredHospitals.forEach(hospital => {
          const marker = L.marker([hospital.lat, hospital.lng]).addTo(map).bindPopup(`<strong>${hospital.name}</strong><br>Distance: ${hospital.distance.toFixed(2)} km`);
          hospitalMarkers.push(marker);
        });

        const hospitalInfoElement = document.getElementById('hospital-info');
        hospitalInfoElement.innerHTML = '';
        filteredHospitals.forEach(hospital => displayHospitalInfo(hospital.name, hospital.distance));
      }

      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            document.getElementById("location").innerText = `Latitude: ${lat}, Longitude: ${lng}`;
            initMap(lat, lng);
          });
        } else {
          document.getElementById("location").innerText = "Geolocation is not supported by this browser.";
        }
      }
    </script>
  </body>
</html>
